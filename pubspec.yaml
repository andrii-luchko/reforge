  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0




flutter_gen:
  assets:
    exclude: 
      - assets/i18n/**/*


flutter:

  uses-material-design: true

  shaders:
    - shaders/sun_rays.frag
    - shaders/particles.frag


  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Variable.ttf

    - family: Mechsuit
      fonts:
        - asset: assets/fonts/Mechsuit.otf

    - family: ClashGrotesk
      fonts:
        - asset: assets/fonts/ClashGrotesk-Variable.ttf


  assets:
    - assets/images/icons/
    - assets/images/svg/
    - assets/images/png/
    - assets/audio/
   
   
