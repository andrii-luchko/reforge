name: reforge
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  

  cupertino_icons: ^1.0.8

  injectable: ^2.7.1
  get_it: ^9.2.0

  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  flutter_bloc: ^9.1.1

  go_router: ^17.0.1

  shared_preferences: ^2.5.4

  theme_extensions_builder_annotation: 7.1.0

  talker: ^5.1.6

  slang: ^4.11.1
  slang_flutter: ^4.11.0

  flutter_svg: ^2.2.3
  gradient_borders: ^1.0.2

  url_launcher: ^6.3.2
  
  firebase_core: ^4.3.0
  firebase_analytics: ^12.1.0
  firebase_crashlytics: ^5.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  very_good_analysis: ^10.0.0

  build_runner: ^2.10.4
  build_verify: ^3.1.1


  flutter_gen_runner: ^5.12.0

  freezed: ^3.2.3
  json_serializable: ^6.10.0
  injectable_generator: ^2.7.0

  theme_extensions_builder: ^7.1.0

  go_router_builder: ^4.1.3
  slang_build_runner: ^4.11.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_lints: ^6.0.0


flutter_gen:
  assets:
    exclude: 
      - assets/i18n/**/*


flutter:

  uses-material-design: true

  shaders:
    - shaders/sun_rays.frag
    - shaders/particles.frag


  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Variable.ttf

    - family: Mechsuit
      fonts:
        - asset: assets/fonts/Mechsuit.otf

    - family: ClashGrotesk
      fonts:
        - asset: assets/fonts/ClashGrotesk-Variable.ttf


  assets:
    - assets/images/icons/
    - assets/images/svg/
    - assets/images/png/
   
   

